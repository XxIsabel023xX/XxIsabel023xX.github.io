<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onderhoud</title>
    <style>
        /* Algemene stijl voor de pagina */
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container voor de onderhoudsboodschap */
        .maintenance-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            max-width: 500px;
            margin: 20px;
        }

        .maintenance-container img {
            max-width: 100px;
            height: auto;
            margin-bottom: 20px;
        }

        .maintenance-container h1 {
            color: #002e74;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .maintenance-container p {
            font-size: 16px;
            color: #666;
        }

        .maintenance-container a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #002e74;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .maintenance-container a:hover {
            background-color: #003e9b;
        }

        /* Media query voor kleine schermen */
        @media (max-width: 480px) {
            .maintenance-container {
                padding: 15px;
            }

            .maintenance-container h1 {
                font-size: 20px;
            }

            .maintenance-container p {
                font-size: 14px;
            }

            .maintenance-container a {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <img src="path_to_maintenance_icon.png" alt="Onderhoud">
        <h1>Onderhoud</h1>
        <p>Dit gedeelte van de website is momenteel niet beschikbaar vanwege onderhoudswerkzaamheden. Probeer het later opnieuw.</p>
        <a href="index.html">Terug naar Home</a>
    </div>

</body>
</html>
