<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam Centraal Vertrekkende Treinen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .loading {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Treinen die vertrekken vanaf Amsterdam Centraal binnen 5 minuten</h1>

<div id="loading" class="loading">Bezig met laden...</div>
<table id="treinenTable" style="display: none;">
    <thead>
        <tr>
            <th>Bestemming</th>
            <th>Vertrektijd</th>
            <th>Spoor</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
  const apiKey = 'ebc94987ca20431391dff5ec1073a50c'; // Zorg ervoor dat deze sleutel correct is
  const stationCode = 'AMS'; // Amsterdam Centraal

  async function fetchTreinen() {
    const now = new Date();
    const fiveMinutesLater = new Date(now.getTime() + 5 * 60000);
    
    try {
      const response = await fetch(`https://gateway.apiportal.ns.nl/reisinformatie-api/api/v2/departures?station=${stationCode}`, {
        method: 'GET',
        headers: {
          'Cache-Control': 'no-cache',
          'Ocp-Apim-Subscription-Key': apiKey
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP-fout! Status: ${response.status}`);
      }

      const data = await response.json();
      console.log('Data ontvangen:', data);

      const treinen = data.payload.departures;

      // Filter de treinen die binnen de komende 5 minuten vertrekken
      const upcomingTrains = treinen.filter(train => {
        const vertrektijd = new Date(train.plannedDateTime);
        return vertrektijd >= now && vertrektijd <= fiveMinutesLater;
      });

      return upcomingTrains;

    } catch (error) {
      console.error('Fout bij ophalen van gegevens:', error);
    }
  }

  function updateTreinenTable(treinen) {
    const tableBody = document.querySelector('#treinenTable tbody');
    tableBody.innerHTML = ''; // Leeg de tabel

    treinen.forEach(train => {
      const row = document.createElement('tr');

      const bestemmingCell = document.createElement('td');
      bestemmingCell.textContent = train.direction;
      row.appendChild(bestemmingCell);

      const vertrektijdCell = document.createElement('td');
      vertrektijdCell.textContent = new Date(train.plannedDateTime).toLocaleTimeString();
      row.appendChild(vertrektijdCell);

      const spoorCell = document.createElement('td');
      spoorCell.textContent = train.plannedTrack;
      row.appendChild(spoorCell);

      tableBody.appendChild(row);
    });
  }

  function hideLoading() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('treinenTable').style.display = 'table';
  }

  async function updateTreinen() {
    const treinen = await fetchTreinen();
    if (treinen) {
      updateTreinenTable(treinen);
      hideLoading(); // Verberg de laadbalk na het laden
    }
  }

  // Update de treinen elke minuut
  setInterval(updateTreinen, 60000);

  // Laad de treinen bij het openen van de pagina
  window.onload = updateTreinen;

</script>

</body>
</html>
