<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        /* Stijlen voor de body en de algemene pagina-instellingen */
        body {
            background-color: #333; /* Donkere achtergrond voor de gehele pagina */
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white; /* Voor betere leesbaarheid bij een donkere achtergrond */
        }

        /* Stijlen voor het hoofdmenu */
        .headmenu {
            padding: 10px 15px;
            background-color: #002e74;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .menupic {
            width: 30px; /* Voor een kleinere menuafbeelding */
            margin-right: 10px; /* Ruimte tussen afbeelding en tekst */
            transition: transform 0.5s ease; /* Voor een soepele draaiing */
        }

        /* Stijlen voor het zijmenu */
        .side-nav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .side-nav a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .side-nav a:hover {
            color: #f1f1f1;
        }

        .menupic2 {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: auto;
            transition: transform 0.5s ease;
        }

        /* Grid container stijlen */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-gap: 10px;
            padding: 10px;
            background-color: #003e9b; /* Blauwe achtergrond */
        }

        /* Grid item stijlen */
        .grid-item {
            background-color: #003e9b;
            color: white;
            padding: 20px;
            font-size: 20px;
            text-align: center;
            border-radius: 5px;
        }

        .grid-item a {
            display: block;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .grid-item a:hover {
            background-color: #12438d;
        }

        .grid-item img {
            max-width: 60px;
            height: auto;
            margin-bottom: 10px;
        }

        /* Media query voor kleine schermen */
        @media (max-width: 480px) {
            .headmenu {
                padding: 10px;
                font-size: 16px;
            }

            .grid-item {
                padding: 10px;
                font-size: 16px;
            }

            .grid-item img {
                max-width: 50px;
            }

            .side-nav a {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Hoofdmenu -->
    <div class="headmenu">
        <img class="menupic" src="menupic.png" alt="Menupic" onclick="toggleMenu()">
        HTV-GMS
    </div>

    <!-- Zijmenu -->
    <div id="sideMenu" class="side-nav">
        <img class="menupic2" src="menupic.png" alt="Menupic" onclick="toggleMenu()">
        <!-- Menu inhoud -->
        <a href="index.html">Main Menu</a>
        <a href="Maker.html">Maker</a>
        <a href="Informatie.html">Informatie</a>
    </div>

    <!-- Grid container voor links -->
    <div class="grid-container">
        <div class="grid-item">
            <a href="boeteuitschrijven.html">
                <img src="path_to_person_icon.png" alt="Persoon">
                <p>Bekeuren</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="kentekencheck.html">
                <img src="path_to_vervoermiddel_icon.png" alt="Vervoer">
                <p>Vervoer</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="https://www.google.com/maps" target="_blank">
                <img src="path_to_Locatie_icon.png" alt="Locatie">
                <p>Locatie</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="artikels.html">
                <img src="path_to_Artikels_icon.png" alt="Artikels">
                <p>Artikels</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="meldingopnemen.html" target="_blank">
                <img src="path_to_Afhandelen_icon.png" alt="Afhandelen">
                <p>Melding opnemen</p>
            </a>
        </div>
        <div class="grid-item">
            <a href="link-naar-Afhandelen-pagina.html">
                <img src="path_to_Multimedia_icon.png" alt="Multimedia">
                <p>Afhandelen</p>
            </a>
        </div>
    </div>

    <script>
        // Functie om het zijmenu te toggelen
        function toggleMenu() {
            var menu = document.getElementById("sideMenu");
            var logo = document.querySelector('.menupic');

            if (menu.style.width === "250px") {
                menu.style.width = "0";
                logo.style.transform = "rotate(0deg)"; // Logo terugdraaien
            } else {
                menu.style.width = "250px";
                logo.style.transform = "rotate(90deg)"; // Logo 90 graden draaien
            }
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            }, function(err) {
              console.log('ServiceWorker registration failed: ', err);
            });
          });
        }
      </script>
</body>
</html>
