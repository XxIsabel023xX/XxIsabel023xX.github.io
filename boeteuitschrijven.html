<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proces-Verbaal Formulier</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #003e9b;
}

        .form-container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #26364e;
            border: 1px solid #26364e;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .section {
            border-top: 2px solid #ffffff;
            padding-top: 20px;
            margin-top: 20px;
        }

        .row {
            display: flex;
            color: #fff;
            align-items: center;
            margin-bottom: 15px;
        }

        .row label {
            flex: 1;
            font-weight: bold;
        }

        .row input, .row textarea, .row select {
            flex: 2;
            padding: 8px;
            border: 1px solid #ccc;
            width: 100%;
        }

        .row input[type="checkbox"] {
            width: auto;
        }

        textarea {
            height: 60px;
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #0056b3;
        }
                /* Stijlen voor het hoofdmenu */
                .headmenu {
            padding: 10px 15px;
            background-color: #002e74;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .menupic {
            width: 30px; /* Voor een kleinere menuafbeelding */
            margin-right: 10px; /* Ruimte tussen afbeelding en tekst */
            transition: transform 0.5s ease; /* Voor een soepele draaiing */
        }

        /* Stijlen voor het zijmenu */
        .side-nav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .side-nav a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .side-nav a:hover {
            color: #f1f1f1;
        }

        .menupic2 {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: auto;
            transition: transform 0.5s ease;
        }

    </style>
</head>
<body>

     <!-- Hoofdmenu -->
     <div class="headmenu">
        <img class="menupic" src="menupic.png" alt="Menupic" onclick="toggleMenu()">
        HTV-GMS
    </div>

    <!-- Zijmenu -->
    <div id="sideMenu" class="side-nav">
        <img class="menupic2" src="menupic.png" alt="Menupic" onclick="toggleMenu()">
        <!-- Menu inhoud -->
        <a href="Maker.html">Maker</a>
        <a href="Informatie.html">Informatie</a>
        <a href="pagina3.html">Link 3</a>
        <a href="index.html">Main Menu</a>
    </div>


    <div class="form-container">
        <form id="proces-verbaal-form">
            <h1>Proces-Verbaal</h1>

            <!-- Sectie 1: Basisinformatie -->
            <div class="section">
                <div class="row">
                    <label for="opsporingsinstantie">Naam opsporingsinstantie:</label>
                    <input type="text" id="opsporingsinstantie" name="opsporingsinstantie">
                </div>
                <div class="row">
                    <label>Kennisgeving van:</label>
                    <input type="checkbox" id="strafbeschikking" name="kennisgeving" value="strafbeschikking">
                    <label for="strafbeschikking">Strafbeschikking</label>
                    <input type="checkbox" id="bekeuring" name="kennisgeving" value="bekeuring">
                    <label for="bekeuring">Bekeuring</label>
                    <input type="checkbox" id="beschikking" name="kennisgeving" value="beschikking">
                    <label for="beschikking">Beschikking</label>
                    <!-- Andere opties indien nodig -->
                </div>
                <div class="row">
                    <label for="procesverbaalnummer">Proces-Verbaal Nummer:</label>
                    <input type="text" id="procesverbaalnummer" name="procesverbaalnummer">
                </div>
                <div class="row">
                    <label for="zaaknummer">Zaak nr. PSH-TM:</label>
                    <input type="text" id="zaaknummer" name="zaaknummer">
                </div>
            </div>

            <!-- Sectie 2: Datum, Tijd, en Plaats -->
            <div class="section">
                <div class="row">
                    <label for="datum">Datum:</label>
                    <input type="date" id="datum" name="datum">
                </div>
                <div class="row">
                    <label for="tijdstip">Tijdstip:</label>
                    <input type="time" id="tijdstip" name="tijdstip">
                </div>
                <div class="row">
                    <label for="plaats">Plaats:</label>
                    <input type="text" id="plaats" name="plaats">
                </div>
            </div>

            <!-- Sectie 3: Wegcode en Verkeersinformatie -->
            <div class="section">
                <div class="row">
                    <label for="wegcode">Wegcode:</label>
                    <input type="text" id="wegcode" name="wegcode">
                </div>
                <div class="row">
                    <label for="hmpaal">HM-paal:</label>
                    <input type="text" id="hmpaal" name="hmpaal">
                </div>
                <div class="row">
                    <label for="gemeente">Gemeente:</label>
                    <input type="text" id="gemeente" name="gemeente">
                </div>
                <div class="row">
                    <label for="soortweg">Soort weg/vaartuig:</label>
                    <input type="text" id="soortweg" name="soortweg">
                </div>
            </div>

            <!-- Sectie 4: Voertuiggegevens -->
            <div class="section">
                <div class="row">
                    <label for="merk">Merk:</label>
                    <input type="text" id="merk" name="merk">
                </div>
                <div class="row">
                    <label for="type">Type:</label>
                    <input type="text" id="type" name="type">
                </div>
                <div class="row">
                    <label for="kleur">Kleur:</label>
                    <input type="text" id="kleur" name="kleur">
                </div>
                <div class="row">
                    <label for="land">Land:</label>
                    <input type="text" id="land" name="land">
                </div>
                <div class="row">
                    <label for="kenteken">Kenteken/registratieteken:</label>
                    <input type="text" id="kenteken" name="kenteken">
                </div>
            </div>

            <!-- Sectie 5: Overtredingsinformatie -->
            <div class="section">
                <div class="row">
                    <label for="categorie">Categorie:</label>
                    <input type="text" id="categorie" name="categorie">
                </div>
                <div class="row">
                    <label for="nummer">Nummer:</label>
                    <input type="text" id="nummer" name="nummer">
                </div>
                <div class="row">
                    <label for="gedrag">Plaats/gedrag/overtreding:</label>
                    <textarea id="gedrag" name="gedrag"></textarea>
                </div>
            </div>

            <!-- Sectie 6: Verklaring verdachte -->
            <div class="section">
                <div class="row">
                    <label for="verklaring">Verklaring verdachte:</label>
                    <textarea id="verklaring" name="verklaring"></textarea>
                </div>
                <div class="row">
                    <label for="recht">Recht op:</label>
                    <input type="checkbox" id="rechtbijstand" name="recht" value="rechtbijstand">
                    <label for="rechtbijstand">Recht op rechtbijstand</label>
                    <input type="checkbox" id="vertaling" name="recht" value="vertaling">
                    <label for="vertaling">Recht op vertolking en vertaling</label>
                </div>
            </div>

            <!-- Sectie 7: Identificatiegegevens -->
            <div class="section">
                <div class="row">
                    <label for="document">Document aangevinkt:</label>
                    <input type="checkbox" id="paspoort" name="document" value="paspoort">
                    <label for="paspoort">Paspoort</label>
                    <input type="checkbox" id="idkaart" name="document" value="idkaart">
                    <label for="idkaart">ID Kaart</label>
                    <input type="checkbox" id="rijbewijs" name="document" value="rijbewijs">
                    <label for="rijbewijs">Rijbewijs</label>
                </div>
                <div class="row">
                    <label for="documentnummer">Nummer document:</label>
                    <input type="text" id="documentnummer" name="documentnummer">
                </div>
                <div class="row">
                    <label for="naam">Naam:</label>
                    <input type="text" id="naam" name="naam">
                </div>
                <div class="row">
                    <label for="geboortedatum">Geboortedatum:</label>
                    <input type="date" id="geboortedatum" name="geboortedatum">
                </div>
                <div class="row">
                    <label for="adres">Adres:</label>
                    <input type="text" id="adres" name="adres">
                </div>
            </div>

            <!-- Ondertekening -->
            <div class="section">
                <div class="row">
                    <label for="handtekening">Handtekening:</label>
                    <input type="text" id="handtekening" name="handtekening">
                </div>
                <div class="row">
                    <label for="datumondertekening">Datum ondertekening:</label>
                    <input type="date" id="datumondertekening" name="datumondertekening">
                </div>
            </div>

            <button type="button" onclick="submitToDiscord()">Verzenden naar Discord</button>
        </form>
    </div>

    <script>
        function submitToDiscord() {
            const webhookUrl = "https://discord.com/api/webhooks/1279128353168953386/r8mPWR6VKpI7ZSxR_5y37Dni7AsUeKBhdM6hIeqbm4SJuJwg8zL-zQRM19--ZqF6WZU6"; // Voeg hier je Webhook URL toe

            // Formuliergegevens ophalen
            const formData = new FormData(document.getElementById('proces-verbaal-form'));
            let messageContent = '';

            formData.forEach((value, key) => {
                messageContent += `${key}: ${value}\n`;
            });

            // Verzend de gegevens naar de Discord Webhook
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: messageContent
                })
            }).then(response => {
                if (response.ok) {
                    alert('Formulier succesvol verzonden naar Discord!');
                } else {
                    alert('Er is iets misgegaan bij het verzenden van het formulier.');
                }
            }).catch(error => {
                console.error('Fout bij het verzenden:', error);
                alert('Er is een fout opgetreden bij het verzenden van het formulier.');
            });
        }
    </script>
    <script>
        // Functie om het zijmenu te toggelen
        function toggleMenu() {
            var menu = document.getElementById("sideMenu");
            var logo = document.querySelector('.menupic');
    
            if (menu.style.width === "250px") {
                menu.style.width = "0";
                logo.style.transform = "rotate(0deg)"; // Logo terugdraaien
            } else {
                menu.style.width = "250px";
                logo.style.transform = "rotate(90deg)"; // Logo 90 graden draaien
            }
        }
    </script>
</body>
</html>
